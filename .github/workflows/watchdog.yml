name: Brief watchdog
on:
  schedule:
    - cron: '35 13 * * *'   # 9:35am EDT
    - cron: '35 14 * * *'   # 9:35am EST after DST ends
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Alert Eric if today's brief is missing
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python3 - <<'EOF'
          import datetime, os, smtplib, ssl, zoneinfo
          from email.mime.text import MIMEText
          today = datetime.datetime.now(zoneinfo.ZoneInfo("America/New_York")).strftime("%Y-%m-%d")
          if os.path.exists(f"briefs/{today}.html"):
              print(f"brief {today} exists; all good"); raise SystemExit(0)
          # second cron of the day may run after DST flip only; avoid double alerts
          sender = "ericwang1869@gmail.com"
          msg = MIMEText(f"morningtext WATCHDOG: no brief for {today} as of 9:35am ET.\n"
                         "The cloud routine likely failed (check https://claude.ai/code/routines/trig_01HWFEypMwhNa7xScSCbiBbb) — hit 'Run now' there to recover.")
          msg["Subject"] = f"⚠️ morningtext brief MISSING - {today}"
          msg["From"] = f"morningtext watchdog <{sender}>"
          msg["To"] = sender
          with smtplib.SMTP_SSL("smtp.gmail.com", 465, context=ssl.create_default_context()) as s:
              s.login(sender, os.environ["GMAIL_APP_PASSWORD"])
              s.sendmail(sender, [sender], msg.as_string())
          print("alert sent")
          EOF
